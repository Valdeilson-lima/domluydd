<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c81e1e" />
    <title>Sem conexão | Don Luydd Pizzaria</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fffbf5;
        color: #1c1512;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.55;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid rgba(28, 21, 18, 0.12);
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 12px 32px -16px rgba(28, 21, 18, 0.18);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .brand img {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        object-fit: cover;
      }
      .brand strong {
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.025em;
      }
      p {
        margin: 0 0 20px;
        font-size: 15px;
        color: #5e524a;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        border: 0;
        background: #c81e1e;
        color: #ffffff;
      }
      a {
        border: 1px solid rgba(28, 21, 18, 0.18);
        background: #f5ece0;
        color: #1c1512;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img
          src="/icons/icon-192.png"
          alt="Don Luydd Pizzaria"
          width="44"
          height="44"
        />
        <strong>Don Luydd Pizzaria</strong>
      </div>
      <h1>Você está sem internet</h1>
      <p>
        Assim que a conexão voltar, toque em tentar novamente para abrir o
        cardápio da Don Luydd Pizzaria.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">
          Tentar novamente
        </button>
        <a href="/cardapio">Voltar ao cardápio</a>
      </div>
    </main>
  </body>
</html>
